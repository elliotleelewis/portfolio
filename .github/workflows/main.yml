on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
jobs:
  commit-message:
    name: semantic-pull-request
    if: contains(fromJson('["pull_request", "pull_request_target"]'), github.event_name)
    runs-on: ubuntu-26.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  # Tests the site the build job made, rather than building it again.
  e2e:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
  deploy:
    # The merge queue's branches are temporary, so there's nothing to
    # preview. Main deploys once the merge lands.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-26.04
    # One deploy at a time per database, so two never migrate it at once.
    concurrency: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      # Main is the live site, and everything else a preview, each with a
      # leaderboard database of its own (see wrangler.toml).
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Turnstile's site key, for saving scores to the leaderboard. Site
          # keys are public. Previews build without it, so they use
          # Turnstile's test key, to match the test secret in wrangler.toml.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ env.ENVIRONMENT == 'production' && vars.TURNSTILE_SITE_KEY || '' }}
      # Before the deploy, so the new code never meets an old table.
      - run: .github/scripts/leaderboard-db.sh "$ENVIRONMENT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 08bcfcb3f50021eafc9bd1bfb1f06ad0
      # Deploys functions/ (the leaderboard's API) along with the site, with
      # the bindings in wrangler.toml.
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 08bcfcb3f50021eafc9bd1bfb1f06ad0
          command: pages deploy ./dist --project-name=portfolio --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
